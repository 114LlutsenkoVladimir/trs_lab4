<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}">
</head>

<body th:attr="data-open-error=${openErrorModal}">
<div th:replace="~{fragments/header :: header}"></div>

<form th:action="@{/productGroups/moveParametersToAnotherGroup}" method="get">
    <select name="from" required>
        <option value="">-- Оберіть параметр --</option>
        <option th:each="p : ${allProductGroups}"
                th:value="${p.id}"
                th:text="${p.name}">
        </option>
    </select>

    <select name="to" required>
        <option value="">-- Оберіть параметр --</option>
        <option th:each="p : ${allProductGroups}"
                th:value="${p.id}"
                th:text="${p.name}">
        </option>
    </select>

    <select name="parameterGroupId" required>
        <option value="">-- Оберіть параметр --</option>
        <option th:each="p : ${allParameterGroups}"
                th:value="${p.id}"
                th:text="${p.name}">
        </option>
    </select>

    <button type="submit" class="btn btn-danger mt-2">move</button>
</form>

<table class="table table-striped table-hover table-sm" th:if="${productGroups != null and !productGroups.isEmpty()}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Група параметрів</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${productGroups}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td>
            <div th:each="pg : ${p.productGroupParameterGroups}">
                <span th:text="${pg.parameterGroup.name}"></span>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${productGroups == null or productGroups.isEmpty()}">
    Немає продуктів, що задовольняють умову.
</p>

<div class="modal fade" id="errorModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Помилка</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p th:text="${error}">Помилка</p>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/showError.js}"></script>
</body>
</html>
