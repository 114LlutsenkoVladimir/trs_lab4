<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div class="modal fade" id="productInfoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">Інформація про продукт</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" id="productDetailsContainer">
                <!-- Сюди JS підставить HTML з product-details.html -->
            </div>

        </div>
    </div>
</div>

<div th:fragment="content">
    <div th:if="${dtoTable != null and !dtoTable.isEmpty()}">

        <div th:with="item=${dtoTable[0]}">
            <h5>Інформація про продукт</h5>

            <table class="table table-bordered">
                <tbody>
                <tr>
                    <th>ID продукту</th>
                    <td th:text="${item.product.productId}"></td>
                </tr>
                <tr>
                    <th>Назва</th>
                    <td th:text="${item.product.productName}"></td>
                </tr>
                <tr>
                    <th>Опис</th>
                    <td th:text="${item.product.productDescription}"></td>
                </tr>
                <tr>
                    <th>ID групи</th>
                    <td th:text="${item.product.productGroupId}"></td>
                </tr>
                <tr>
                    <th>Група</th>
                    <td th:text="${item.product.productGroupName}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <h5 class="mt-3">Параметри продукту</h5>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID параметра</th>
                <th>Назва параметра</th>
                <th>Одиниця виміру</th>
                <th>Значення</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="parameter : ${dtoTable[0].parameters}">
                <td th:text="${parameter.parameterId}"></td>
                <td th:text="${parameter.parameterName}"></td>
                <td th:text="${parameter.parameterUnit}"></td>
                <td th:text="${parameter.parameterValue}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${dtoTable == null}">
        <p>Немає даних для відображення. null</p>
    </div>

    <div th:if="${dtoTable != null and dtoTable.isEmpty()}">
        <p>Немає даних для відображення. Empty</p>
    </div>
</div>

</body>
</html>
