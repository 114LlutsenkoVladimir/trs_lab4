<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">
    <div th:if="${dtoTable != null and !dtoTable.isEmpty()}">

        <div th:with="item=${dtoTable[0]}">
            <h5>Інформація про продукт</h5>

            <table class="table table-bordered">
                <tbody>
                <tr>
                    <th>ID продукту</th>
                    <td th:text="${item.product.productId}"></td>
                </tr>
                <tr>
                    <th>Назва</th>
                    <td th:text="${item.product.productName}"></td>
                </tr>
                <tr>
                    <th>Опис</th>
                    <td th:text="${item.product.productDescription}"></td>
                </tr>
                <tr>
                    <th>ID групи</th>
                    <td th:text="${item.product.productGroupId}"></td>
                </tr>
                <tr>
                    <th>Група</th>
                    <td th:text="${item.product.productGroupName}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <h5 class="mt-3">Параметри продукту</h5>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID параметра</th>
                <th>Назва параметра</th>
                <th>Одиниця виміру</th>
                <th>Значення</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="parameter : ${dtoTable[0].parameters}">
                <td th:text="${parameter.parameterId}"></td>
                <td th:text="${parameter.parameterName}"></td>
                <td th:text="${parameter.parameterUnit}"></td>
                <td th:text="${parameter.parameterValue}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${dtoTable == null or dtoTable.isEmpty()}">
        <p>Немає даних для відображення.</p>
    </div>
</div>

</body>
</html>
