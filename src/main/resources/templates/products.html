<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}">
</head>

<body>

<form th:action="@{/products/deleteProductsWithParameters}" method="get">
    <select name="productGroupId">
        <option value="">-- Оберіть параметр --</option>
        <option th:each="p : ${allParameters}"
                th:value="${p.id}"
                th:text="${p.name}">
        </option>
    </select>
    <button type="submit">delete</button>
</form>

<form th:action="@{/products/productsByProductGroupId}" method="get">
    <select name="productGroupId">
        <option value="">-- Оберіть параметр --</option>
        <option th:each="p : ${allProductGroups}"
                th:value="${p.id}"
                th:text="${p.name}">
        </option>
    </select>
    <button class="btn btn-outline-danger" type="submit">get by pg</button>
</form>



<form th:action="@{/products/productWithoutParameter}" method="get">

        <select name="parameterId">
            <option value="">-- Оберіть параметр --</option>
            <option th:each="p : ${allParameters}"
                    th:value="${p.id}"
                    th:text="${p.name}">
            </option>
        </select>

    <button class="btn btn-light" type="submit">Get</button>
</form>

<table class="table table-striped table-hover table-sm" th:if="${products != null and !products.isEmpty()}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Опис</th>
        <th>Дата випуску</th>
        <th>Група</th>
        <th>actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.description}"></td>
        <td th:text="${p.releaseDate}"></td>
        <td th:text="${p.productGroup.name}"></td>
        <td>
            <button class="btn btn-outline-info"
                    data-bs-toggle="modal"
                    data-bs-target="#productInfoModal"
                    th:attr="data-bs-url=@{/products/getProductWithParameters/{productId}(productId=${p.id})}">
                <i class="bi bi-eye"></i>
            </button>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${products == null or products.isEmpty()}">
    Немає продуктів, що задовольняють умову.
</p>

<div class="modal fade" id="productInfoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">Інформація про продукт</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <!-- Перевірка, що список не пустий -->
                <div th:if="${dtoTable != null and !dtoTable.isEmpty()}">

                    <!-- Беремо перший елемент для загальної інформації про продукт -->
                    <div th:with="item=${dtoTable[0]}">

                        <h5>Інформація про продукт</h5>

                        <table class="table table-bordered">
                            <tbody>
                            <tr>
                                <th>ID продукту</th>
                                <td th:text="${item.productId}"></td>
                            </tr>
                            <tr>
                                <th>Назва</th>
                                <td th:text="${item.productName}"></td>
                            </tr>
                            <tr>
                                <th>Опис</th>
                                <td th:text="${item.productDescription}"></td>
                            </tr>
                            <tr>
                                <th>Дата випуску</th>
                                <td th:text="${item.productReleaseDate}"></td>
                            </tr>
                            <tr>
                                <th>ID групи</th>
                                <td th:text="${item.productGroupId}"></td>
                            </tr>
                            <tr>
                                <th>Група</th>
                                <td th:text="${item.productGroupName}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>


                    <!-- Таблиця параметрів -->
                    <h5 class="mt-3">Параметри продукту</h5>

                    <table class="table table-striped table-bordered">
                        <thead>
                        <tr>
                            <th>ID параметра</th>
                            <th>Назва параметра</th>
                            <th>Одиниця виміру</th>
                            <th>Значення</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="row : ${dtoTable}">
                            <td th:text="${row.parameterId}"></td>
                            <td th:text="${row.parameterName}"></td>
                            <td th:text="${row.parameterUnit}"></td>
                            <td th:text="${row.parameterValue}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Якщо список порожній -->
                <div th:if="${dtoTable == null or dtoTable.isEmpty()}">
                    <p>Немає даних для відображення.</p>
                </div>

            </div>

        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/showModal.js}"></script>
</body>
</html>
