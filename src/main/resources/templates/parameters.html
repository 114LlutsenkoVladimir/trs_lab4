<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}"
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<form th:action="@{/parameters/parametersByGroup}" method="get">
    <select name="productGroupId" required>
        <option value="">-- Оберіть параметр --</option>
        <option th:each="p : ${allProductGroups}"
                th:value="${p.id}"
                th:text="${p.name}">
        </option>
    </select>
    <button class="btn btn-outline-danger" type="submit">get by pg</button>
</form>


    <table class="table table-striped table-hover table-sm" th:if="${parameters != null and !parameters.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Назва</th>
            <th>Одиниця вимірювання</th>
            <th>Група</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${parameters}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.unit}"></td>
            <td th:text="${p.parameterGroup.name}"></td>
        </tr>
        </tbody>
    </table>

    <p th:if="${parameters == null or parameters.isEmpty()}">
        Немає продуктів, що задовольняють умову.
    </p>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
